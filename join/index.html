<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Join a trip — ControlFreak</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a1a;
      --ink-soft: #4a4a4a;
      --ink-muted: #8a8a8a;
      --cream: #f7f4ef;
      --accent: #2c5f2e;
      --rule: #d4cfc6;
      --white: #ffffff;
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .brand { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); }
    h1 { font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.2; margin: 14px 0 10px; }
    p { color: var(--ink-soft); font-size: 15px; line-height: 1.55; }
    .code {
      margin: 28px auto 8px;
      display: inline-block;
      padding: 16px 22px;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 16px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--accent);
    }
    .hint { font-size: 13px; color: var(--ink-muted); margin-top: 18px; }
    .missing { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ControlFreak</div>
    <h1>You're invited to a trip</h1>
    <p id="with-code">Open ControlFreak, go to Trips, tap <strong>Join with code</strong> and enter:</p>
    <div class="code" id="code" aria-label="Invite code"></div>
    <p class="missing" id="no-code">This invite link is missing its code. Ask whoever sent it for the 6-character trip code.</p>
    <p class="hint">Already have the app? Tapping the invite link on your iPhone opens the trip directly.</p>
  </main>
  <script>
    (function () {
      var raw = new URLSearchParams(window.location.search).get('code') || '';
      var code = raw.toUpperCase().trim();
      if (/^[A-Z0-9]{6}$/.test(code)) {
        document.getElementById('code').textContent = code;
      } else {
        document.getElementById('code').style.display = 'none';
        document.getElementById('with-code').style.display = 'none';
        document.getElementById('no-code').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
